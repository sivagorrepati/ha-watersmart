[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-watersmart"
version = "0.1.0"
description = "WaterSmart hourly water usage integration for Home Assistant"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.11"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "homeassistant>=2026.10"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.watersmart" = ["*.json", "translations/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

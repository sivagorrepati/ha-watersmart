name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/build_release.py --output dist/ha-watersmart.zip
